services:
  - type: web
    name: factoryguard-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FACTORYGUARD_ORIGINS
        sync: false
      - key: FACTORYGUARD_API_KEY
        generateValue: true
      - key: FACTORYGUARD_DB
        value: /tmp/factoryguard.db
